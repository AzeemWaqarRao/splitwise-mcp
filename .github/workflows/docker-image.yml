name: Docker Image CI

env:
  VERSION: $(date +%s)
  
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag registry.azeemwaqar.com/splitwise-mcp:$VERSION
    - name: Push the docker image
      run: docker push registry.azeemwaqar.com/splitwise-mcp:$VERSION
