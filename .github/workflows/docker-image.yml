name: Docker Image CI
  
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]



jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4  
    - name: Configure SSH
      env:
       SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh/
        echo "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        # Install cloudflared on the runner
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
        chmod +x /usr/local/bin/cloudflared

        # Configure SSH to route through the tunnel
        cat >> ~/.ssh/config << EOF
        Host $SSH_HOST
          ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
          StrictHostKeyChecking no
        EOF
    - name: Deploy Docker Image
      env:
        SSH_USER: ${{ secrets.DEPLOY_USERNAME }}
        SSH_URL: ${{ secrets.DEPLOY_SSH_URL }}
      run: ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_URL 'docker ps'
    - name: Version Check
      run: echo "The version is $GITHUB_RUN_ID"
    - name: Build the Docker Image
      run: docker build . --file Dockerfile --tag registry.azeemwaqar.com/splitwise-mcp:$GITHUB_RUN_ID
    - name: Push the Docker Image
      run: docker push registry.azeemwaqar.com/splitwise-mcp:$GITHUB_RUN_ID
