name: Docker Image CI
  
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
  SSH_URL: ${{ secrets.DEPLOY_SSH_URL }}
  SSH_USER: ${{ secrets.DEPLOY_USERNAME }}
  IMAGE_NAME: registry.azeemwaqar.com/splitwise-mcp:${{ github.run_id }}
  CONTAINER_NAME: "splitwise-mcp"

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4  
    
    - name: Version Check
      run: echo "The version is $CONTAINER_NAME"
      
    - name: Build the Docker Image
      run: docker build . --file Dockerfile --tag $IMAGE_NAME
 
    - name: Push the Docker Image
      run: docker push $IMAGE_NAME

    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh/
        echo "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        # Install cloudflared on the runner
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
        chmod +x /usr/local/bin/cloudflared

        # Configure SSH to route through the tunnel
        cat >> ~/.ssh/config << EOF
        Host $SSH_URL
          ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
          StrictHostKeyChecking no
        EOF
   
    - name: Deploy Docker Image
      run: |
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_URL \
          "docker stop $CONTAINER_NAME || true && \
           docker rm $CONTAINER_NAME || true && \
           docker run -d -p 8000:8000 --name $CONTAINER_NAME $IMAGE_NAME"      
